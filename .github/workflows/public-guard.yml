name: public-guard
# Server-side backstop for the local pre-push hook: scans the pushed
# tree for personal data and secrets (scripts/public-guard.mjs).
on:
  push:
  pull_request:
jobs:
  public-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/public-guard.mjs
